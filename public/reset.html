<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FountHW – Reset password</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#4f46e5,#7c3aed);font-family:system-ui,Segoe UI,sans-serif;padding:16px}
.card{background:#fff;width:100%;max-width:400px;border-radius:16px;padding:32px;box-shadow:0 20px 50px rgba(0,0,0,.25);text-align:center}
.logo{width:56px;height:56px;border-radius:14px;background:#4f46e5;color:#fff;font:700 30px/56px system-ui;margin:0 auto 16px}
h1{font-size:22px;margin:0 0 6px;color:#111827}
p{color:#6b7280;font-size:14px;margin:0 0 20px}
input{width:100%;padding:12px 14px;border:1px solid #d1d5db;border-radius:10px;font-size:15px;margin-bottom:12px}
input:focus{outline:2px solid #4f46e5;border-color:transparent}
button{width:100%;padding:12px;border:0;border-radius:10px;background:#4f46e5;color:#fff;font-size:15px;font-weight:600;cursor:pointer}
button:disabled{opacity:.6}
.msg{margin-top:14px;font-size:14px}.err{color:#dc2626}
</style></head>
<body><div class="card">
<div class="logo">F</div>
<h1 id="t">Loading…</h1><p id="s"></p>
<form id="f" hidden>
<input id="p1" type="password" placeholder="New password" minlength="6" required>
<input id="p2" type="password" placeholder="Repeat password" minlength="6" required>
<button id="b">Save password</button>
</form>
<div id="m" class="msg"></div>
</div>
<script type="module" src="/src/reset.js"></script>
